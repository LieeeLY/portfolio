<!DOCTYPE html>
  <html lang="en" data-theme="light">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Kimberly Quisto – Portfolio</title>
      <meta name="description" content="Personal portfolio">
      <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23C6922E'/%3E%3C/svg%3E">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
      <style>

        :root {
          --font-head: "Fraunces", Georgia, "Times New Roman", serif;
          --font-body: "DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
          --brown: #3B3028;
          --cream: #F5F1E8;
          --gold: #C6922E;
          --charcoal: #171717;
          --offwhite: #FFFCF7;
          --muted-brown: #81766B;
          --border-c: #E5DCCE;
          --light-gold: #F3E8D0;

          /* Light theme (white gold mostly hehe) */
          --bg: var(--cream);
          --surface: var(--offwhite);
          --surface-2: var(--light-gold);
          --border: var(--border-c);
          --text: var(--charcoal);
          --muted: var(--muted-brown);
          --accent: var(--gold);
          --accent-text: var(--charcoal);
          --accent-ink: var(--brown);
          --accent-soft: rgba(198,146,46,.16);
          --radius: 14px; --radius-sm: 12px;
          --shadow: 0 6px 24px rgba(59,48,40,.10);
          --nav-h: 64px;
        }
        
        /* Dark theme*/
        [data-theme="dark"] 
        {
          --bg: #2a221c;
          --surface: var(--brown);
          --surface-2: #4a3e34;
          --border: #55483c;
          --text: var(--cream);
          --muted: #c2b6a6;
          --accent-ink: var(--gold);
          --accent-soft: rgba(198,146,46,.22);
          --shadow: 0 6px 24px rgba(0,0,0,.4);
        }

        /*Mobile*/
        *,*::before,*::after { box-sizing: border-box; }
        html { scroll-behavior: smooth; scroll-padding-top: var(--nav-h); -webkit-text-size-adjust: 100%; }
        body { margin: 0; font-family: var(--font-body); background: var(--bg); color: var(--text); line-height: 1.65; transition: background .3s, color .3s; }
        img, video, iframe { max-width: 100%; display: block; }
        a { color: var(--accent-ink); text-decoration: none; }
        h1,h2,h3 { font-family: var(--font-head); line-height: 1.15; margin: 0 0 .5em; letter-spacing: -.02em; }
        h1 { font-size: clamp(2.3rem, 8vw, 4rem); font-weight: 800; }
        h2 { font-size: clamp(1.6rem, 5vw, 2.3rem); font-weight: 700; }
        h3 { font-size: 1.1rem; font-weight: 600; letter-spacing: -.01em; }
        p { margin: 0 0 1em; }
        .container { width: min(100% - 2.5rem, 1100px); margin-inline: auto; }
        section { padding: 4.5rem 0; }
        .lead { color: var(--muted); font-size: 1.08rem; max-width: 56ch; }
        :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

        .btn { font-weight: 700; display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 1.5rem; border-radius: var(--radius-sm); border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text); font: 700 1rem var(--font-body); cursor: pointer; transition: transform .15s, box-shadow .2s; }
        .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
        .btn:active { transform: scale(.97); }
        .btn.ghost { background: transparent; color: var(--text); border-color: var(--border); }
        .btn.ghost:hover { border-color: var(--accent); background: var(--accent-soft); }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
        .tags { display: flex; flex-wrap: wrap; gap: .5rem; }
        .tag { padding: .25rem .75rem; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-size: .85rem; color: var(--muted); }

        .nav { position: sticky; top: 0; z-index: 50; height: var(--nav-h); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
        .nav .container { height: 100%; display: flex; align-items: center; justify-content: space-between; }
        .logo { font: 700 1.2rem var(--font-head); color: var(--text); }
        .nav-links { position: absolute; top: var(--nav-h); left: 0; right: 0; display: none; flex-direction: column; gap: .25rem; padding: 1rem 1.25rem 1.5rem; background: var(--bg); border-bottom: 1px solid var(--border); }
        .nav-links.open { display: flex; }
        .nav-links a { color: var(--text); font-weight: 500; padding: .8rem .5rem; border-radius: var(--radius-sm); }
        .nav-links a:hover { background: var(--accent-soft); }
        .nav-actions { display: flex; gap: .5rem; }
        .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 1.1rem; cursor: pointer; transition: background .2s, transform .15s; }
        .icon-btn:hover { background: var(--accent-soft); }
        .icon-btn:active { transform: scale(.94); }

          /*Hero*/
          .hero { padding: 3rem 0 4rem; min-height: calc(100svh - var(--nav-h)); display: flex; align-items: center; }
          .hero-grid { display: grid; gap: 2.5rem; align-items: center; }
          .role { color: var(--accent-ink); font-weight: 700; font-size: .95rem; margin-bottom: .75rem; }
          .hero h1 { font-size: clamp(2rem, 6vw, 3.2rem); }
          .pill-banner { height: 72px; max-width: 460px; margin: 1.5rem 0 1.25rem; border-radius: 999px; overflow: hidden; border: 2px solid var(--accent); background: var(--surface-2); }
          .pill-banner img { width: 100%; height: 100%; object-fit: cover; }
          .hero-socials { display: flex; flex-wrap: wrap; gap: .6rem; }
          .social-icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: var(--radius-sm); background: var(--accent); color: var(--accent-text); font: 700 .85rem var(--font-body); transition: transform .15s; }
          .social-icon:hover { transform: translateY(-2px) rotate(-4deg); }
          .btn-row { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.5rem; }
          .hero-art { position: relative; margin: 0; display: grid; place-items: center; min-height: 340px; }
          .hero-art .burst { position: absolute; top: 0; right: 4%; width: 22%; fill: var(--accent); }
          .hero-art .art-square { position: absolute; left: 8%; bottom: 14%; width: 30%; aspect-ratio: 1; background: var(--accent); border-radius: var(--radius-sm); }
          .hero-art #heroImg { position: relative; z-index: 1; width: min(100%, 440px); max-height: 62vh; object-fit: contain; }
          .signature { position: relative; z-index: 2; margin-top: -1.5rem; justify-self: end; font: 700 clamp(1.6rem, 5vw, 2.3rem)/1.1 "Caveat", cursive; color: var(--text); text-align: right; }

          /*About*/
          .about-grid { display: grid; gap: 2rem; }
          .skill-group { padding: 1.5rem; }
          .skill-group + .skill-group { margin-top: 1.25rem; }

          /*Projects*/
          .filters { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1.5rem 0 2rem; }
          .chip { min-height: 44px; padding: 0 1.1rem; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: 600 .95rem var(--font-body); cursor: pointer; transition: background .2s, color .2s; }
          .chip:hover { background: var(--accent-soft); }
          .chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
          .grid { display: grid; gap: 1.25rem; grid-template-columns: 1fr; }
          .project { overflow: hidden; transition: transform .25s; }
          .project:hover { transform: translateY(-4px); }
          .project[hidden] { display: none; }
          .media { position: relative; display: block; width: 100%; aspect-ratio: 4/3; padding: 0; border: 0; background: var(--surface-2); cursor: zoom-in; overflow: hidden; }
          .media img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
          .project:hover .media img { transform: scale(1.04); }
          .badge { position: absolute; right: .6rem; bottom: .6rem; background: rgba(0,0,0,.65); color: #fff; border-radius: 999px; padding: .2rem .7rem; font-size: .8rem; }
          .project-body { padding: 1.25rem; }
          .project-body p { color: var(--muted); font-size: .95rem; }

          .lightbox { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; padding: 1rem; background: rgba(8,10,20,.9); }
          .lightbox.open { display: flex; animation: fade .2s; }
          .lb-stage { max-width: 100%; text-align: center; }
          .lb-stage img, .lb-stage video { max-height: 78vh; max-width: 100%; margin: auto; border-radius: var(--radius-sm); background: #000; }
          .lb-stage iframe { width: min(960px, 92vw); aspect-ratio: 16/9; border: 0; border-radius: var(--radius-sm); }
          .lb-caption { color: #fff; margin-top: .75rem; font-size: .95rem; }
          .lb-btn { position: absolute; width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(255,255,255,.15); color: #fff; font-size: 1.4rem; cursor: pointer; }
          .lb-btn:hover { background: rgba(255,255,255,.3); }
          .lb-close { top: 1rem; right: 1rem; } .lb-prev { left: .75rem; } .lb-next { right: .75rem; }
          @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

          .contact-grid { display: grid; gap: 2rem; }
          .email-link { font: 600 1.2rem var(--font-head); display: block; margin-bottom: 1rem; word-break: break-all; }
          .socials { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 1.25rem; }
          .socials a { font-weight: 600; }
          .form { padding: 1.5rem; display: grid; gap: 1rem; }
          label { font-weight: 600; font-size: .9rem; display: block; }
          input, textarea { width: 100%; margin-top: .35rem; padding: .85rem 1rem; min-height: 48px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; }
          input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
          textarea { min-height: 140px; resize: vertical; }
          .status { min-height: 1.4em; font-size: .9rem; color: var(--muted); }
          footer { padding: 2rem 0; text-align: center; color: var(--muted); border-top: 1px solid var(--border); font-size: .9rem; }

          /*Desktop settings*/
          @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
          @media (min-width: 900px) {
            section { padding: 6rem 0; }
            .hero-grid { grid-template-columns: 1.05fr .95fr; gap: 3rem; }
            .menu-btn { display: none; }
            .nav-links { position: static; display: flex; flex-direction: row; padding: 0; background: none; border: 0; }
            .nav-links a { padding: .5rem .9rem; }
            .about-grid, .contact-grid { grid-template-columns: 1fr 1.2fr; gap: 3rem; }
            .grid { grid-template-columns: repeat(3, 1fr); }
          }
          .reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s, transform .6s; }
          .reveal.in { opacity: 1; transform: none; }
          @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            *,*::before,*::after { transition: none !important; animation: none !important; }
            .reveal { opacity: 1; transform: none; }
          }
      </style>
    </head>
<body>

<header class="nav">
  <div class="container">
    <a href="#home" class="logo" data-bind="name"></a>
    <nav class="nav-links" id="navLinks" aria-label="Main">
      <a href="#about">About</a><a href="#projects">Projects</a><a href="#contact">Contact</a>
    </nav>
    <div class="nav-actions">
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode"></button>
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">☰</button>
    </div>
  </div>
</header>

<main>
  <section class="hero" id="home">
    <div class="container hero-grid">
      <!--text, banner pill, social icons-->
      <div class="hero-text">
        <p class="role" data-bind="role"></p>
        <h1 id="heroTitle"></h1>
        <p class="lead" data-bind="tagline"></p>
        <!-- INSERT BANNER IMAGE HERE: set SITE.heroBanner in the config -->
        <div class="pill-banner"><img id="heroBanner" alt=""></div>
        <div class="hero-socials" id="heroSocials"></div>
        <div class="btn-row">
          <a class="btn" href="#projects">View my work</a>
          <a class="btn ghost" href="#contact">Get in touch</a>
        </div>
      </div>
      <!-- RIGHT: large artwork with decorative shapes and signature -->
      <figure class="hero-art">
        <svg class="burst" viewBox="0 0 100 100" aria-hidden="true"><polygon points="50.0,0.0 56.7,24.9 75.0,6.7 68.4,31.6 93.3,25.0 75.1,43.3 100.0,50.0 75.1,56.7 93.3,75.0 68.4,68.4 75.0,93.3 56.7,75.1 50.0,100.0 43.3,75.1 25.0,93.3 31.6,68.4 6.7,75.0 24.9,56.7 0.0,50.0 24.9,43.3 6.7,25.0 31.6,31.6 25.0,6.7 43.3,24.9"/></svg>
        <div class="art-square" aria-hidden="true"></div>
        <!-- INSERT HERO ARTWORK HERE: set SITE.heroImage in the config (a transparent PNG looks best) -->
        <img id="heroImg" alt="">
        <figcaption class="signature" id="heroSignature"></figcaption>
      </figure>
    </div>
  </section>

  <section id="about">
    <div class="container about-grid">
      <div class="reveal"><h2>About me</h2><div id="bio"></div></div>
      <div class="reveal">
        <div class="card skill-group"><h3>Core skills</h3><div class="tags" id="skills"></div></div>
        <div class="card skill-group"><h3>Software</h3><div class="tags" id="tools"></div></div>
      </div>
    </div>
  </section>

  <section id="projects">
    <div class="container">
      <h2 class="reveal">Projects &amp; gallery</h2>
      <p class="lead reveal">Choose a category, then tap or click any piece to view it larger.</p>
      <div class="filters" id="filters" role="group" aria-label="Filter projects"></div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section id="contact">
    <div class="container contact-grid">
      <div class="reveal">
        <h2>Contact</h2>
        <p class="lead">Have a project or an idea? Send a message or copy my email.</p>
        <a class="email-link" id="emailLink"></a>
        <button class="btn ghost" id="copyEmail" type="button">Copy email</button>
        <div class="socials" id="socials"></div>
      </div>
      <form class="card form reveal" id="contactForm" method="POST">
        <label>Name <input name="name" required autocomplete="name"></label>
        <label>Email <input type="email" name="email" required autocomplete="email"></label>
        <label>Message <textarea name="message" required></textarea></label>
        <button class="btn" type="submit">Send message</button>
        <div class="status" id="formStatus" role="status" aria-live="polite"></div>
      </form>
    </div>
  </section>
</main>

<footer><div class="container">© <span id="year"></span> <span data-bind="name"></span></div></footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Media viewer">
  <button class="lb-btn lb-close" id="lbClose" aria-label="Close">✕</button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous">‹</button>
  <div class="lb-stage"><div id="lbContent"></div><div class="lb-caption" id="lbCaption"></div></div>
  <button class="lb-btn lb-next" id="lbNext" aria-label="Next">›</button>
</div>

<script>
const SITE = {
  name: "Kimberly Quisto",
  role: "Digital Artist & Illustrator",
  tagline: "Your vision. Your interpretation. Your art.",

  // HERO (header) images. Put files in assets/. Leave "" to show a placeholder.
  heroImage:  "slay.png",   // large artwork on the right, e.g. "assets/hero.png" (transparent PNG works best)
  heroBanner: "no noise.png",   // wide strip in the rounded pill, e.g. "assets/banner.jpg"
  signature:  "Kimberly Quisto, Artist",   // handwritten caption under the artwork

  bio: [
    "I'm a Entertainment and Multimedia Computing Major in Digital Animation Technology (EMC-DAT) Student. I’m also an illustrator with an experience as an Art Director for a school organization. I enjoy developing visual concepts, creating illustrations, and bringing ideas to life. Art can be interpreted in many ways, that why I strive to create work that leaves room for each viewer to see it through their own perspective.",
  ],
  skills: ["Storyboard",, "Creativity", "Character Design", "Illustration", "3D Modelling", "Animation", "UI Design"],
  tools:  ["Blender", "Krita", "Figma", "Photoshop", "Unity", "Premiere Pro", "Clip Studio Paint", "VS Code"],

  email: "quilltinity@gmail.com",
  socials: [
    { label: "GitHub", short: "Gh", url: "https://github.com/LieeeLY" },
    { label: "Instagram", short: "Ig", url: "https://www.instagram.com/lieee_ly/" },
    { label: "Behance", short: "Bé", url: "https://www.behance.net/kimberlyquisto1" }
  ],
  formEndpoint: "",

  projects: [
    { title: "Get Tagged Poster", description: "A school project for our game similar to Subway Surfers.",
      category: "Artwork", tags: ["Illustration", "Krita"], type: "image", thumb: "", src: "Get tagged finalized~1.png" },
    { title: "Jinx from Arcane", description: "I created this fanart after the released of the series of Arcane.",
      category: "Fanart", tags: ["Fanart", "Krita"], type: "image", thumb: "", src: "jinx filter.png" },
    { title: "Short clip from Project GenZ (school project)", description: "An exaggerated flying slipper from our 2d film titled Project GenZ.",
      category: "Video", tags: ["Animation", "Adobe Animate"], type: "video", thumb: "Flying slipper", src: "slipper.mp4" },
    { title: "Rotoscope animation project", description: "Self reference for Magik.",
      category: "Video", tags: ["Video"], type: "video", thumb: "", src: "magik final_1.mp4" },
    { title: "Liway Turn-around Character Design", description: "Character Turn-around design for our school project.",
      category: "Game Art Asset", tags: ["Artwork", "Character Design"], type: "image", thumb: "", src: "blackmask.png" },
    { title: "Forgotten Strokes UI", description: "This is from a previous school project.",
      category: "Game Art Asset", tags: ["Artwork", "UI"], type: "image", thumb: "", src: "ui2.png" },
    { title: "Behind the scene of Sequence 8 from Project GenZ (school project)", description: "2 persons looking nervous.",
      category: "Video", tags: ["Animation", "Adobe Animate"], type: "video", thumb: "Nervous", src: "sequence 8.mp4" },
    { title: "Unity Character Testing", description: "Character testing all the movements.",
      category: "Game Art Asset", tags: ["Animation", "Unity"], type: "video", thumb: "", src: "Screen Recording 2025-10-08 152306.mp4" },
    { title: "Character Design", description: "Character design for my 3D Model.",
      category: "Game Art Asset", tags: ["Artwork", "Character Design"], type: "image", thumb: "", src: "dat elec.png" },
    { title: "Character Design for unity", description: "Character design that is inspired from our school uniform.",
      category: "Game Art Asset", tags: ["Artwork", "Character Design"], type: "image", thumb: "", src: "OC.png" },
    { title: "Caine from The Amazing Digital Circus", description: "A short description of the problem, your approach, and the result.",
      category: "Fanart", tags: ["Fanart", "Krita"], type: "image", thumb: "", src: "caine~1.png" },
    { title: "Poem Illustration", description: "A school organization (The Journal) illustration for a poem titled The Fire Within.",
      category: "Artwork", tags: ["Illustration", "Krita"], type: "image", thumb: "", src: "The Fire Within~1.png" },
  ]
};


const $ = id => document.getElementById(id);
function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const k in props) k === "class" ? e.className = props[k] : e.setAttribute(k, props[k]);
  kids.forEach(c => e.append(c)); return e;
}
// Colored placeholder used whenever an image is empty or fails to load
function placeholder(i) {
  const c = ["#C6922E", "#81766B", "#3B3028"][i % 3];
  return "data:image/svg+xml," + encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'><rect width='400' height='300' fill='${c}' opacity='.25'/><circle cx='200' cy='150' r='44' fill='${c}' opacity='.55'/></svg>`);
}

/* Text content */
document.title = SITE.name + " – Portfolio";
document.querySelectorAll("[data-bind]").forEach(e => e.textContent = SITE[e.dataset.bind]);
$("heroTitle").textContent = "Hi, I'm " + SITE.name + ",";
$("heroSignature").textContent = SITE.signature;
SITE.socials.forEach(x => $("heroSocials").append(h("a", { class: "social-icon", href: x.url, target: "_blank", rel: "noopener", "aria-label": x.label, title: x.label }, x.short || x.label.slice(0, 2))));
SITE.bio.forEach(t => $("bio").append(h("p", { class: "lead" }, t)));
SITE.skills.forEach(t => $("skills").append(h("span", { class: "tag" }, t)));
SITE.tools.forEach(t => $("tools").append(h("span", { class: "tag" }, t)));
$("emailLink").textContent = SITE.email; $("emailLink").href = "mailto:" + SITE.email;
SITE.socials.forEach(s => $("socials").append(h("a", { href: s.url, target: "_blank", rel: "noopener" }, s.label)));
$("year").textContent = new Date().getFullYear();

/* Hero images (with placeholder fallback) */
[["heroImg", SITE.heroImage, 0], ["heroBanner", SITE.heroBanner, 1]].forEach(([id, src, n]) => {
  const im = $(id); im.onerror = () => { im.onerror = null; im.src = placeholder(n); }; im.src = src || placeholder(n);
});

/* Theme toggle */
const root = document.documentElement;
function setTheme(t) { root.dataset.theme = t; $("themeBtn").textContent = t === "dark" ? "☀️" : "🌙"; try { localStorage.setItem("theme", t); } catch (e) {} }
let savedTheme = null; try { savedTheme = localStorage.getItem("theme"); } catch (e) {}
setTheme(savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
$("themeBtn").onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark");

/* Mobile menu */
const menuBtn = $("menuBtn"), navLinks = $("navLinks");
function closeMenu() { navLinks.classList.remove("open"); menuBtn.textContent = "☰"; menuBtn.setAttribute("aria-expanded", "false"); }
menuBtn.onclick = () => { const o = navLinks.classList.toggle("open"); menuBtn.textContent = o ? "✕" : "☰"; menuBtn.setAttribute("aria-expanded", o); };
navLinks.querySelectorAll("a").forEach(a => a.onclick = closeMenu);

/* Project cards */
const cards = SITE.projects.map((p, i) => {
  const thumb = h("img", { src: p.thumb || p.src && p.type === "image" && p.src || placeholder(i), alt: p.title + " preview", loading: "lazy" });
  thumb.onerror = () => { thumb.onerror = null; thumb.src = placeholder(i); };
  const media = h("button", { class: "media", type: "button", "aria-label": "View " + p.title }, thumb);
  if (p.type !== "image") media.append(h("span", { class: "badge" }, "▶ Play"));
  const card = h("article", { class: "card project" }, media,
    h("div", { class: "project-body" }, h("h3", {}, p.title), h("p", {}, p.description),
      h("div", { class: "tags" }, ...(p.tags || []).map(t => h("span", { class: "tag" }, t)))));
  card.dataset.category = p.category; card._p = p; card._thumb = thumb; media.onclick = () => openLb(card);
  $("grid").append(card); return card;
});

/* Filters (built from your categories) */
["All", ...new Set(SITE.projects.map(p => p.category))].forEach((c, i) => {
  const b = h("button", { class: "chip" + (i ? "" : " active"), type: "button" }, c);
  b.onclick = () => {
    document.querySelectorAll(".chip").forEach(x => x.classList.remove("active")); b.classList.add("active");
    cards.forEach(card => card.hidden = i !== 0 && card.dataset.category !== c);
  };
  $("filters").append(b);
});

/* Lightbox: mouse, touch swipe, keyboard */
const lb = $("lightbox"); let items = [], idx = 0;
function show(i) {
  idx = (i + items.length) % items.length;
  const card = items[idx], p = card._p, src = p.src || card._thumb.src; let el;
  if (p.type === "video") el = h("video", { src, controls: "", autoplay: "", playsinline: "" });
  else if (p.type === "embed") el = h("iframe", { src, allow: "autoplay; fullscreen", allowfullscreen: "", title: p.title });
  else el = h("img", { src, alt: p.title });
  $("lbContent").replaceChildren(el); $("lbCaption").textContent = p.title;
}
function openLb(card) { items = cards.filter(c => !c.hidden); show(items.indexOf(card)); lb.classList.add("open"); document.body.style.overflow = "hidden"; }
function closeLb() { lb.classList.remove("open"); $("lbContent").replaceChildren(); document.body.style.overflow = ""; }
$("lbClose").onclick = closeLb; $("lbPrev").onclick = () => show(idx - 1); $("lbNext").onclick = () => show(idx + 1);
lb.onclick = e => { if (e.target === lb) closeLb(); };
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") closeLb(); if (e.key === "ArrowLeft") show(idx - 1); if (e.key === "ArrowRight") show(idx + 1);
});
let tx = 0;
lb.addEventListener("touchstart", e => tx = e.changedTouches[0].clientX, { passive: true });
lb.addEventListener("touchend", e => { const d = e.changedTouches[0].clientX - tx; if (Math.abs(d) > 50) show(idx + (d < 0 ? 1 : -1)); }, { passive: true });

/* Copy email */
$("copyEmail").onclick = async function () {
  try { await navigator.clipboard.writeText(SITE.email); this.textContent = "Copied!"; } catch (e) { this.textContent = "Copy it manually above"; }
  setTimeout(() => this.textContent = "Copy email", 2000);
};

/* Contact form */
$("contactForm").addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, d = new FormData(f), s = $("formStatus");
  if (!SITE.formEndpoint) {
    location.href = `mailto:${SITE.email}?subject=${encodeURIComponent("Message from " + d.get("name"))}&body=${encodeURIComponent(d.get("message") + "\n\n" + d.get("email"))}`;
    return;
  }
  s.textContent = "Sending…";
  try {
    const r = await fetch(SITE.formEndpoint, { method: "POST", body: d, headers: { Accept: "application/json" } });
    if (!r.ok) throw 0; s.textContent = "Message sent. Thank you!"; f.reset();
  } catch (err) { s.textContent = "Could not send. Please email me directly."; }
});

/* Scroll reveal */
const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }), { threshold: .15 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));
</script>
</body>
